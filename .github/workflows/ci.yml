name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.27.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build:lib
      - name: dist starts with "use client"
        run: |
          for file in dist/index.js dist/index.cjs; do
            head -n 1 "$file" | grep -qx '"use client";' || {
              echo "$file does not start with \"use client\"" >&2
              exit 1
            }
          done
      - run: pnpm check:package

  # peerDependencies says react >=18, so the tests run on 18 too. Only the
  # tests: typecheck covers the Next.js demo, which needs React 19.
  react18:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.27.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm add -D react@18 react-dom@18 @types/react@18 @types/react-dom@18
      - run: node -e "if (!require('react/package.json').version.startsWith('18.')) process.exit(1)"
      - run: pnpm test
